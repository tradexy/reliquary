name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify (typecheck, security scan, 200+ tests)
        run: npm run verify

      - name: Build both apps
        run: |
          npm run build -w apps/seal
          npm run build -w apps/witness

      - name: Verify both demo bundles offline
        run: |
          npm run verify:bundle -- packages/core/data/bundle.json
          npm run verify:bundle -- packages/core/data/kiro-audit.bundle.json

      - name: Assemble site
        run: |
          mkdir -p _site/seal _site/witness
          cp -R apps/seal/dist/. _site/seal/
          cp -R apps/witness/dist/. _site/witness/
          cp site/index.html _site/index.html
          cp site/favicon.svg _site/favicon.svg
          cp _site/seal/index.html _site/seal/404.html
          cp _site/witness/index.html _site/witness/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
