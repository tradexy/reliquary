<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Catalogue — Reliquary</title>
    <meta name="description" content="Ashworth Local History Society card index, resurrected from the 1994 dBase export." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset ─────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--color-bg, #0d1a12);
        color: var(--color-ink, #e8dfc8);
        font-family: var(--font-body, serif);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Focus ring ─────────────────────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--color-accent, #7eb87e);
        outline-offset: 2px;
      }

      /* ── Print stylesheet ───────────────────────────────────────────── */
      @media print {
        /* Hide everything by default; the request slip opt-in with class. */
        body > #root {
          display: none;
        }

        .print-request-slip {
          display: block !important;
        }

        @page {
          size: A5 landscape;
          margin: 1.5cm 2cm;
        }

        .request-slip {
          font-family: 'EB Garamond', Georgia, serif;
          font-size: 11pt;
          color: #000;
          border: 1.5pt solid #000;
          padding: 1.2cm 1.4cm;
          max-width: 18cm;
        }

        .request-slip__header {
          border-bottom: 1pt solid #000;
          padding-bottom: 0.5cm;
          margin-bottom: 0.6cm;
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
        }

        .request-slip__society {
          font-size: 9pt;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }

        .request-slip__heading {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 14pt;
          font-weight: 400;
          margin: 0;
        }

        .request-slip__field {
          display: flex;
          gap: 0.5cm;
          margin-bottom: 0.4cm;
          border-bottom: 0.5pt solid #ccc;
          padding-bottom: 0.2cm;
        }

        .request-slip__label {
          font-size: 8pt;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: #555;
          min-width: 2.5cm;
          flex-shrink: 0;
          padding-top: 2pt;
        }

        .request-slip__value {
          font-size: 11pt;
        }

        .request-slip__reader-line {
          margin-top: 0.8cm;
          display: flex;
          gap: 0.5cm;
        }

        .request-slip__signature-box {
          border-bottom: 0.5pt solid #000;
          flex: 1;
          margin-bottom: 0.1cm;
        }

        .request-slip__footer {
          margin-top: 0.6cm;
          font-size: 8pt;
          color: #777;
          text-align: right;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
