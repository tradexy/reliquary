<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parts Ledger — Reliquary</title>
    <meta name="description" content="Redhill Motor Factors — acquired stock ledger reconciled from the dot-matrix printout." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset ─────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--color-bg, #1a1410);
        color: var(--color-ink, #e0d4c0);
        font-family: var(--font-body, sans-serif);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Focus ring ─────────────────────────────────────────────────── */
      :focus-visible {
        outline: 2px solid var(--color-accent, #c87941);
        outline-offset: 2px;
      }

      /* ── Print stylesheet ───────────────────────────────────────────── */
      @media print {
        /* Hide everything by default; the stocktake sheet opts in with class. */
        body > #root {
          display: none;
        }

        .print-stocktake-sheet {
          display: block !important;
        }

        @page {
          size: A4 landscape;
          margin: 1.5cm 2cm;
        }

        .print-sheet__header {
          border-bottom: 1.5pt solid #000;
          padding-bottom: 0.4cm;
          margin-bottom: 0.6cm;
        }

        .print-sheet__title {
          font-family: 'IBM Plex Serif', Georgia, serif;
          font-size: 16pt;
          font-weight: 400;
          margin: 0 0 0.25cm;
        }

        .print-sheet__meta {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 9pt;
          color: #555;
          display: flex;
          gap: 2cm;
        }

        .print-sheet__all-items {
          width: 100%;
          border-collapse: collapse;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 8pt;
        }

        .print-sheet__all-items th {
          text-align: left;
          padding: 0.15cm 0.3cm;
          border-bottom: 1pt solid #000;
          font-weight: 500;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          font-size: 7pt;
        }

        .print-sheet__all-items td {
          padding: 0.12cm 0.3cm;
          border-bottom: 0.5pt solid #ccc;
        }

        .print-row--discrepant td {
          background: #fff8f8;
          font-weight: 500;
        }

        .print-sheet__footer {
          margin-top: 0.8cm;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 9pt;
          border-top: 0.5pt solid #ccc;
          padding-top: 0.4cm;
          display: flex;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
